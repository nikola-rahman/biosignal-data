# PTB-XL "all", 100 Hz, from scratch, PROXY size (the v3 proxy bench, user 2026-10-29: small
# proxy models, successive halving): a ~4 M global transformer (width 256, 4 layers, 4 heads)
# with the tokenizer: D2 as in the first bench (local width 128, 4 S4D layers, 0.24 s
# tokens, mean residual). Recipe: lr 1e-4, betas (0.9, 0.95), warmup 1.5 epochs,
# cosine over 25 epochs, clip 1.0, fixed slots, 2.5 s crops. Checks that proxies rank as the
# full-size models did (0.9170 8 samples, ~0.91 D1, 0.897 D2, 0.8947 64 samples).
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [from_scratch]
  reference: null              # the reference_xresnet1d101 recipe; not run
  linear_probing: false
  fixed_slots: true            # one slot per lead name
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 25
  fine_tuning_patience: null       # the cosine schedule runs to its end
  fine_tuning_learning_rate: 1.0e-4
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.95]
  fine_tuning_warmup_epochs: 1.5
  fine_tuning_schedule: cosine
  fine_tuning_grad_clip: 1.0
  fine_tuning_head: linear
  from_scratch_samples_per_token: null
  from_scratch_tokenizer: {kind: hierarchical, frame_s: 0.04, frame_hop_s: 0.02, frames_per_token: 12,
    stem_windows: 2, stem_channels: 64, kernel_frequencies: 24, kernel_min_hz: 1.0,
    kernel_max_hz: 240.0, local_width: 128, local_layers: 4, local_states: 64, pool_heads: 4,
    residual_pool: mean}
  from_scratch_model: {width: 256, layers: 4, heads: 4, feed_forward: 896, dropout: 0.0, drop_path: 0.0}
  fine_tuning_rungs: null
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
