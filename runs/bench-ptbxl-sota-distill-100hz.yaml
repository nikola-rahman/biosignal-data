# PTB-XL "all", 100 Hz, from scratch (no other data), official folds (1-8 train, 9 chooses the
# epoch, 10 test), macro-AUC, seed 0. Arm 5b: born-again self-distillation (Furlanello et al.
# 2018, arXiv 1805.04770): a student of the same size and recipe trained on
# 0.5 x labels + 0.5 x the teacher's probabilities on the same training crop (teacher in eval
# mode, one more forward per step). Recipe parts and sources: benchmarks/supervised.py.
# Input: the teacher's chosen weights, /workspace/sota-weights/baseline.pt, written by
# bench-ptbxl-sota-baseline-100hz.yaml (save_chosen_to). The teacher must have the student's
# model settings (d_model, d_state, n_layers, input_size_s); its file holds the scored weights
# (the moving average when the teacher used ema_decay).
# For the combined recipe: copy every reference_s4 field of the combined config, set
# teacher_weights to that run's save_chosen_to file, run after the teacher has finished.
# Question: does the teacher's soft target raise the macro-AUC of the same model?
# Expected: +0.002 to +0.005. Reason: the teacher's probabilities carry the similarity between
# the 71 labels (e.g. the many co-occurring form and diagnostic statements) and soften the noisy
# labels of PTB-XL (statements by one cardiologist, likelihoods dropped); BANs gained on
# CIFAR-100 with the same size. Risk: with one teacher of ~0.94 the student can copy its errors.
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [reference_s4]
  reference: null              # the reference_xresnet1d101 recipe; not run
  reference_s4:
    input_size_s: 2.5           # input_size 250 (train_ecg_model.py default)
    valid_stride_fraction: 1.0  # val_stride None -> stride input_size (ecg_dataset_wrapper.py)
    validation_on: logits       # ModelCheckpoint monitor val/val_macro_agg (logits averaged)
    test_on: probabilities      # test_scores = sigscores_agg (sigmoid, then averaged)
    batch_size: 128             # batch_size default
    epochs: 100                 # epochs default
    learning_rate: 1.0e-3       # lr default, constant (no scheduler)
    weight_decay: 1.0e-3        # ECGLightningModel wd default
    betas: [0.9, 0.999]         # torch AdamW defaults
    eps: 1.0e-8
    d_model: 512                # d_model default
    d_state: 8                  # d_state default
    n_layers: 4                 # n_layers default
    dropout: 0.2                # s4_dropout default
    dt_min: 1.0e-3              # HippoSSKernel defaults
    dt_max: 1.0e-1
    loss: bce   # RecipeSettings (benchmarks/supervised.py)
    class_balanced_beta: null
    asymmetric: null
    ema_decay: null
    augmentation: null
    schedule: constant
    warmup_epochs: 0
    patience_epochs: 25         # stop after 25 epochs without a fold-9 gain (every arm)
    distillation: {teacher_weights: /workspace/sota-weights/baseline.pt, teacher_fraction: 0.5}
    save_chosen_to: /workspace/sota-weights/distill.pt  # a teacher of a second generation
  reference_s4_channels: null   # the channel-set S4; not run
  reference_s4_incontext: null  # the in-context S4; not run
  linear_probing: false
  fixed_slots: false           # a random channel slot per record, as in pretraining
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 100
  fine_tuning_patience: null
  fine_tuning_learning_rate: 1.0e-3
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.999]
  fine_tuning_warmup_epochs: 0.0
  fine_tuning_schedule: constant
  fine_tuning_grad_clip: null
  fine_tuning_head: linear
  from_scratch_samples_per_token: null
  from_scratch_tokenizer: null
  from_scratch_model: null           # the checkpoint's size, no dropout
  fine_tuning_rungs: null
  fine_tuning_label_fraction: 1.0  # every training patient
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
