# Model v0, a test of the whole chain on the CPU of the standard server: real data from
# S3 through the test index, a very small network, a few hundred steps. It measures the
# reading speed; the model is too small to mean anything.
data:
  store: s3://biosignal-data
  index: smoke-2026-10-20
  train_split: train
  validation_split: validation
  signal_types: null          # every channel
  datasets: null              # every dataset of the index
  cache_directory: /root/cache-smoke
  cache_bytes: 21474836480    # 20 GiB
  block_s: 1800.0               # the unit of work; also the longest example
  shuffle_buffer: 512
  reads_in_flight: 8
  workers: 3
  pieces_per_epoch: 1
  mixture: null               # every block once per epoch (the mix follows the data)

tokens:
  max_tokens: 1024
  samples_per_token: 64
  max_channels: 16
  rows: 4
  mask_ratio: 0.5

model:
  width: 128
  layers: 4
  heads: 4
  feed_forward: 512
  min_wavelength_s: 0.01
  max_wavelength_s: 10000.0
  attention: dense
  tokenizer: {kind: samples}  # 64-sample tokens, as v0-v2
  dropout: 0.0  # as v0-v2
  drop_path: 0.0

optim:
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  warmup_steps: 50
  steps: 300
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  schedule: cosine
  decay_steps: null
  decay_shape: null

run:
  name: v0-cpu-smoke
  seed: 0
  device: cpu
  precision: fp32
  log_every: 10
  validate_every: 100
  validation_batches: 5
  checkpoint_every: 300
  checkpoint_prefix: models/v0-cpu-smoke
  wandb_project: biosignal-fm
  wandb_entity: schnyox-s
  wandb_mode: online
  max_bad_steps: 20
  bad_batch_directory: /root/debug/bad-batches
  resume: newest
