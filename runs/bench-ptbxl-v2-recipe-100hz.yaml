# PTB-XL task "all" for the last checkpoint (step 330,000) of v2-unimax, with the same
# settings as for v1-pretrain (bench-ptbxl-v1-recipe-*.yaml), fine-tuning only (the
# from-scratch baseline does not depend on the checkpoint). The fine-tuning recipe
# of the ECG foundation model benchmark (arXiv 2509.25095, section 3.3, and its code
# github.com/AI4HealthUOL/ecg-fm-benchmarking: run.sh, main_lite.py, fm_ecg.py):
# - AdamW, head learning rate 1e-3, weight decay 1e-3, constant schedule, 100 epochs,
#   batch 64, a linear head;
# - layer-dependent learning rates: upper blocks x0.1, embedding and lowest blocks x0.01
#   (their ECG-JEPA split: 3 of 12 blocks in the lowest part);
# - a random 2.5 s crop per training record and epoch; validation and test records scored
#   as the mean probability of their four 2.5 s crops;
# - the 100 Hz records (their run.sh reads the 500 Hz ones: this run differs only there,
#   to separate the effect of the rate from that of the recipe); the epoch chosen on fold 9.
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [fine_tuning]
  reference: null              # the reference_xresnet1d101 recipe; not run
  reference_s4: null
  reference_s4_channels: null   # the channel-set S4; not run
  reference_s4_incontext: null  # the in-context S4; not run
  linear_probing: false
  fixed_slots: false           # a random channel slot per record, as in pretraining
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 100
  fine_tuning_patience: null
  fine_tuning_learning_rate: 1.0e-3
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.999]
  fine_tuning_warmup_epochs: 0.0
  fine_tuning_schedule: constant
  fine_tuning_grad_clip: null
  fine_tuning_head: linear
  from_scratch_samples_per_token: null
  from_scratch_tokenizer: null
  from_scratch_model: null           # the checkpoint's size, no dropout
  fine_tuning_rungs: null
  fine_tuning_label_fraction: 1.0  # every training patient
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
