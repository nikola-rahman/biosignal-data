# PTB-XL task "all" at 100 Hz: the paper's own baseline xresnet1d101 (Strodthoff et al. 2021,
# Table II: 0.925 +- 0.008) trained through our pipeline (records, labels, folds, macro-AUC)
# with its recipe, to check the pipeline (user, 2026-10-29: our models from scratch get 0.79).
# The checkpoint is only read by the CLI; the reference model starts from random weights.
# Recipe and sources: src/biosignal_model/benchmarks/xresnet1d.py.
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [reference_xresnet1d101]
  reference:
    input_size_s: 2.5           # fastai_model.py input_size
    valid_stride_fraction: 0.5  # stride_length_valid = input_size // 2
    aggregate: max              # aggregate_fn default
    batch_size: 128             # bs
    epochs: 50                  # epochs; the last one is scored (no early stopping)
    max_lr: 1.0e-2              # lr, fit_one_cycle
    weight_decay: 1.0e-2        # wd, true_wd and bn_wd (fastai v1)
    pct_start: 0.3              # fastai v1 fit_one_cycle defaults
    div_factor: 25.0
    final_div: 250000.0         # div_factor * 1e4
    moms: [0.95, 0.85]
    beta2: 0.99                 # fastai v1 Learner opt_func Adam betas (0.9, 0.99)
    eps: 1.0e-8                 # torch Adam
    kernel_size: 5              # kernel_size
    ps_head: 0.5                # ps_head
    lin_ftrs_head: [128]        # lin_ftrs_head
  reference_s4: null
  reference_s4_channels: null   # the channel-set S4; not run
  reference_s4_incontext: null  # the in-context S4; not run
  linear_probing: false
  fixed_slots: false           # a random channel slot per record, as in pretraining
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 100
  fine_tuning_patience: null
  fine_tuning_learning_rate: 1.0e-3
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.999]
  fine_tuning_warmup_epochs: 0.0
  fine_tuning_schedule: constant
  fine_tuning_grad_clip: null
  fine_tuning_head: linear
  from_scratch_samples_per_token: null
  from_scratch_tokenizer: null
  from_scratch_model: null           # the checkpoint's size, no dropout
  fine_tuning_rungs: null
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
