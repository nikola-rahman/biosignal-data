# PTB-XL, all six tasks, linear linear_probing of the last checkpoint (step 330,000) of v2-unimax:
# the encoder frozen, one logistic regression per label on each record's mean feature, its
# L2 chosen on fold 9, scored on fold 10; also the same encoder from random weights. To compare
# v1 and v2 without fine-tuning (user, 2026-10-29). No fine-tuning in this run.
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 500
  tasks: [all, diagnostic, subdiagnostic, superdiagnostic, form, rhythm]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: []
  linear_probing: true
  # down to 1e-7: on "all" the fold-9 AUC fell from 1e-4 on, the smallest of the first grid
  linear_probing_l2: [1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 100
  fine_tuning_patience: null
  fine_tuning_learning_rate: 1.0e-3
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
