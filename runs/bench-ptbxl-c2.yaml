# The PTB-XL benchmark (Strodthoff et al. 2021 protocol) at 100 Hz, as in the paper's main
# tables, for the last checkpoint of v0-rtx6000-c2 (step 30,000, validation loss 0.1635).
store: s3://biosignal-data
checkpoint: models/v0-rtx6000-c2/step-00030000.pt
device: cuda
settings:
  rate: 100
  tasks: [all, diagnostic, subdiagnostic, superdiagnostic, form, rhythm]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [fine_tuning, from_scratch]
  linear_probing: true
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 20
  fine_tuning_patience: null
  fine_tuning_learning_rate: 3.0e-4
  fine_tuning_weight_decay: 0.05
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 1.0   # one learning rate for every weight (as run)
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: null                 # the whole record
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
