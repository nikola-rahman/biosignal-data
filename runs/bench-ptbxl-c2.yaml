# The PTB-XL benchmark (Strodthoff et al. 2021 protocol) at 100 Hz, as in the paper's main
# tables, for the last checkpoint of v0-rtx6000-c2 (step 30,000, validation loss 0.1635).
store: s3://biosignal-data
checkpoint: models/v0-rtx6000-c2/step-00030000.pt
device: cuda
settings:
  rate: 100
  tasks: [all, diagnostic, subdiagnostic, superdiagnostic, form, rhythm]
  rows: 8
  read_threads: 32
  probe_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  probe_steps: 100
  finetune_epochs: 20
  finetune_learning_rate: 3.0e-4
  finetune_weight_decay: 0.05
  finetune_examples_per_step: 64
  finetune_discriminative_factor: 1.0   # one learning rate for every weight (as run)
  finetune_lower_blocks_fraction: 0.25
  finetune_crop_s: null                 # the whole record
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
