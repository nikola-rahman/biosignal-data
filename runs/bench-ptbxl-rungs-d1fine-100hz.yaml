# PTB-XL "all", 100 Hz, from scratch, PROXY size, for the halving bench with WSD cooldown
# rungs (coordinator, 2026-10-29; Hägele et al. 2024): the ~4 M proxy of
# bench-ptbxl-proxy-d1fine-100hz (D1, 40 ms tokens every 20 ms).
# Constant lr after a 1.5-epoch warmup for 20 epochs; at epochs 5, 10 and 20 a branch decays
# the lr linearly to 0 over max(2, round(0.2 x epoch)) epochs (2, 2, 4) and is scored; fold 9
# of the branches chooses. The learning rate here is the middle of the runner's grid (3e-5,
# 1e-4, 3e-4), which sets it per run.
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 16
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [from_scratch]
  reference: null              # the reference_xresnet1d101 recipe; not run
  reference_s4: null
  reference_s4_channels: null   # the channel-set S4; not run
  reference_s4_incontext: null  # the in-context S4; not run
  linear_probing: false
  fixed_slots: true            # one slot per lead name
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 20           # the last rung
  fine_tuning_patience: null
  fine_tuning_learning_rate: 1.0e-4
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.95]
  fine_tuning_warmup_epochs: 1.5
  fine_tuning_schedule: constant   # the cooldowns are in the rungs' branches
  fine_tuning_grad_clip: 1.0
  fine_tuning_head: linear
  from_scratch_samples_per_token: null
  from_scratch_tokenizer: {kind: duration, token_s: 0.04, hop_s: 0.02, stem_windows: 2, stem_channels: 64,
    kernel_frequencies: 24, kernel_min_hz: 1.0, kernel_max_hz: 240.0}
  from_scratch_model: {width: 256, layers: 4, heads: 4, feed_forward: 1024, dropout: 0.0, drop_path: 0.0}
  fine_tuning_rungs: {epochs: [5, 10, 20], fraction: 0.2, min_epochs: 2}
  fine_tuning_label_fraction: 1.0  # every training patient
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
