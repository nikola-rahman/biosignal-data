# PTB-XL "all", 100 Hz, from scratch: the token-size test (user, 2026-10-29). As
# bench-ptbxl-from-scratch-recipe-lr1.0e-4-100hz.yaml (64 samples = 0.64 s per token: 0.8947),
# with 8 samples per token (0.08 s at 100 Hz).
store: s3://biosignal-data
checkpoint: models/v2-unimax/step-00330000.pt
device: cuda
settings:
  rate: 100
  tasks: [all]
  rows: 8
  read_threads: 32
  workers: 6                  # data loader processes that crop and pack batches
  methods: [from_scratch]
  reference: null              # the reference_xresnet1d101 recipe; not run
  linear_probing: false
  fixed_slots: true            # one slot per lead name
  linear_probing_l2: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  linear_probing_steps: 100
  fine_tuning_epochs: 50
  fine_tuning_patience: null       # the cosine schedule runs to its end
  fine_tuning_learning_rate: 1.0e-4
  fine_tuning_weight_decay: 1.0e-3
  fine_tuning_examples_per_step: 64
  fine_tuning_discriminative_factor: 0.1
  fine_tuning_lower_blocks_fraction: 0.25
  fine_tuning_crop_s: 2.5
  evaluation_stride_fraction: 1.0    # crops without overlap (arXiv 2509.25095)
  evaluation_aggregate: mean
  fine_tuning_slot_group: lower
  fine_tuning_betas: [0.9, 0.95]
  fine_tuning_warmup_epochs: 2.5
  fine_tuning_schedule: cosine
  fine_tuning_grad_clip: 1.0
  fine_tuning_head: linear
  from_scratch_samples_per_token: 8
  seed: 0
wandb_project: biosignal-fm
wandb_entity: schnyox-s
wandb_mode: online
