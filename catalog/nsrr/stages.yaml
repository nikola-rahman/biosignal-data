id: nsrr/stages
name: Stanford Technology Analytics and Genomics in Sleep
signals:
- eeg
- eog
- emg
- ecg
- resp
- spo2
source:
  type: nsrr
  slug: stages
access:
  tier: application
  steps:
  - Create an account at https://sleepdata.org and submit a data access request for this dataset; wait
    for approval.
  - Copy your token from https://sleepdata.org/token and set NSRR_TOKEN.
  - 'Install the official NSRR tool: `gem install nsrr --no-document` (needs Ruby).'
  credentials:
  - NSRR_TOKEN
homepage: https://sleepdata.org/datasets/stages
stats:
  subjects: 1881
  hours: 15000
  hours_estimated: true
