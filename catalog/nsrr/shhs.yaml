id: nsrr/shhs
name: Sleep Heart Health Study
signals:
- eeg
- eog
- emg
- ecg
- resp
- spo2
source:
  type: nsrr
  slug: shhs
access:
  tier: application
  steps:
  - Create an account at https://sleepdata.org and submit a data access request for this dataset; wait
    for approval.
  - Copy your token from https://sleepdata.org/token and set BIOSIGNAL_NSRR_TOKEN.
  - 'Install the official NSRR tool: `gem install nsrr --no-document` (needs Ruby).'
  credentials:
  - BIOSIGNAL_NSRR_TOKEN
homepage: https://sleepdata.org/datasets/shhs
stats:
  subjects: 5804
  recordings: 8450
  hours: 68000
  hours_estimated: true
