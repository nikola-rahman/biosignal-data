id: nsrr/hchs
name: 'Hispanic Community Health Study / Study of Latinos: Sleep'
signals:
- resp
- spo2
source:
  type: nsrr
  slug: hchs
access:
  tier: application
  steps:
  - Create an account at https://sleepdata.org and submit a data access request for this dataset; wait
    for approval.
  - Copy your token from https://sleepdata.org/token and set NSRR_TOKEN.
  - 'Install the official NSRR tool: `gem install nsrr --no-document` (needs Ruby).'
  credentials:
  - NSRR_TOKEN
homepage: https://sleepdata.org/datasets/hchs
stats:
  subjects: 14000
  hours: 110000
  hours_estimated: true
  note: Home sleep apnea tests; no EEG.
