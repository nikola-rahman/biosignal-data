  - Copy your token from https://sleepdata.org/token and set NSRR_TOKEN.
  - 'Install the official NSRR tool: `gem install nsrr --no-document` (needs Ruby).'
  credentials:
  - NSRR_TOKEN
homepage: https://sleepdata.org/datasets/mros
