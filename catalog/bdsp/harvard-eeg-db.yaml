id: bdsp/harvard-eeg-db
name: Harvard EEG Database (HEEDB)
signals:
- eeg
- ecg
source:
  type: s3
  bucket: arn:aws:s3:us-east-1:184438910517:accesspoint/bdsp-credentialed-access-point
  version: '4.1'
access:
  tier: credentialed
  license: BDSP Restricted Health Data License 1.0.0
  steps:
  - Create an account at https://bdsp.io, upload a CITI human-subjects research certificate and sign the
    BDSP data use agreement for this dataset.
  - After approval, BDSP issues AWS credentials for its credentialed S3 access point; store them as an
    AWS profile and pass --aws-profile.
homepage: https://bdsp.io/content/harvard-eeg-db/
stats:
  subjects: 109178
  hours: 2000000
  hours_estimated: true
  note: Hours from one 2026 preprint; the BDSP page lists 284k studies only.
notes:
- Key prefix inside the access point is given by BDSP after approval.
