# Rules for the training index (biosignal-data index), per dataset: how recordings map to
# persons (for splits by person), recordings to leave out, and channel types that only the
# dataset's own documentation can tell. Every rule names its source; `certain: true` only
# when the source states it, with the quote in `evidence`. See docs/training-layer.md.
#
# A dataset without an entry: each recording is its own subject, not certain; channel types
# from the general rules in src/biosignal_data/index/signals.py only.
#
# Quotes checked against the pages on 2026-10-20; patterns checked against every recording.

datasets:
  - id: physionet/adfecgdb
    subject:
      rule: one_per_recording  # 5 recordings
      certain: true
      source: https://physionet.org/content/adfecgdb/1.0.0/
      evidence: >-
        contains multichannel fetal electrocardiogram (FECG) recordings obtained from 5
        different women in labor, between 38 and 41 weeks of gestation.
    channels:
      - name: '^Direct_\d+$'
        type: ecg
        source: https://physionet.org/content/adfecgdb/1.0.0/
        notes: fetal ECG from a scalp electrode (direct)
      - name: '^Abdomen_\d+$'
        type: ecg
        source: https://physionet.org/content/adfecgdb/1.0.0/
        notes: abdominal ECG (maternal and fetal), not breathing effort

  - id: physionet/afdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/afdb/1.0.0/
      notes: >-
        "25 long-term ECG recordings of human subjects"; the page does not say whether two
        recordings come from one person.

  - id: physionet/apnea-ecg
    subject:
      rule: pattern
      pattern: '^([abcx]\d{2})r?$'  # a01, and a01r: the respiration record of a01
      certain: false
      source: https://physionet.org/content/apnea-ecg/1.0.0/
      notes: >-
        A record and its respiration record (a01, a01r) are one night of one person. The
        page does not say whether the learning set (a, b, c) and the test set (x) share
        persons.
    held_out:
      - pattern: '^x\d{2}r?$'
        benchmark: apnea-ecg per-minute apnea detection
        source: https://physionet.org/content/apnea-ecg/1.0.0/
        evidence: >-
          a test set of 35 records (x01 through x35)
    exclude:
      - pattern: '^c05$'
        reason: a part of another recording of the dataset
        source: https://physionet.org/content/apnea-ecg/1.0.0/
        evidence: >-
          In April 2013, Chiu-wen Wu reported that training set control records c05 and c06
          come from the same original recording (c05 begins 80 seconds later than c06).
        checked: >-
          2026-10-20: all 2,793,000 samples of c05 equal those of c06 from 80 s (8,000
          samples) on; c06 is 11,000 samples longer.

  - id: physionet/autonomic-aging-cardiovascular
    subject:
      rule: one_per_recording  # 1,121 recordings
      certain: true
      source: https://physionet.org/content/autonomic-aging-cardiovascular/1.0.0/
      evidence: >-
        Electrocardiogram and continuous non-invasive blood pressure signals were recorded
        simultaneously at rest in 1,121 healthy volunteers.

  - id: physionet/brugada-huca
    subject:
      rule: pattern
      pattern: '^files/(\d+)/\d+$'
      certain: true
      source: https://physionet.org/content/brugada-huca/1.0.0/
      evidence: Each row corresponds to one recording, identified by a unique patient_id.

  - id: physionet/butqdb
    subject:
      rule: pattern
      pattern: '^(\d{3})\d{3}/'
      certain: true
      source: https://physionet.org/content/butqdb/1.0.0/
      evidence: >-
        The names of the recordings are six-digit numbers where the first three numbers are
        unique subject identifiers and the next three numbers indicate the measurement
        number of this subject.

  - id: physionet/capslpdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/capslpdb/1.0.0/
      notes: >-
        108 recordings, 16 healthy subjects and "92 pathological recordings"; the page does
        not say that each pathological recording is a different person.

  - id: physionet/cebsdb
    subject:
      rule: pattern
      pattern: '^[bmp](\d{3})$'
      certain: true
      source: https://physionet.org/files/cebsdb/1.0.0/info.txt
      evidence: >-
        Records are labelled either as b***, m*** or p*** where *** varies from 001 to 020
        and identifies the subject under measurement.

  - id: physionet/challenge-2017
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/challenge-2017/1.0.0/
      notes: The page gives no subjects for the 8,528 training recordings.
    exclude:
      - pattern: '^validation/'
        reason: a copy of another recording of the dataset
        source: https://physionet.org/content/challenge-2017/1.0.0/
        evidence: >-
          by running it on a small subset (validation set, 300 recordings) of the training
          set
        checked: >-
          2026-10-20: each of the 300 validation records has the same samples as the
          training record of the same name.

  - id: physionet/challenge-2018
    subject:
      rule: pattern
      pattern: '^(?:training|test)/([^/]+)/'
      certain: true
      source: https://physionet.org/content/challenge-2018/1.0.0/
      evidence: Each directory contains one subdirectory per subject (e.g. training/tr03-0005 ).
    channels:
      - name: '^(CHEST|ABD)$'
        type: resp
        source: https://physionet.org/content/challenge-2018/1.0.0/
        notes: respiratory effort of the chest and the abdomen

  - id: physionet/chbmit
    subject:
      rule: pattern
      pattern: '^(chb\d{2})/'
      same_person: [[chb01, chb21]]
      certain: true
      source: https://physionet.org/content/chbmit/1.0.0/
      evidence: Case chb21 was obtained 1.5 years after case chb01, from the same female subject.
    channels:
      - name: '^[A-Z]{1,2}\d{0,2}Z?-(Ref|CS2)$'
        type: eeg
        source: https://physionet.org/content/chbmit/1.0.0/
        notes: EEG electrodes against a reference (FC1-Ref, O1-CS2).
      - name: '^(-|VNS)$'
        type: other
        source: https://physionet.org/content/chbmit/1.0.0/
        evidence: >-
          In some cases, up to 5 "dummy" signals (named "-") were interspersed among the EEG
          signals [...] these dummy signals can be ignored. [...] a vagal nerve stimulus (VNS)
          signal in the last 18 files belonging to case chb09.
        notes: The '.' channels (320) are not described on the page and stay unknown.

  - id: physionet/ctu-uhb-ctgdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/ctu-uhb-ctgdb/1.0.0/
      notes: >-
        552 recordings selected from 9164; the page does not say whether one woman or one
        fetus has more than one.
    channels:
      - name: '^FHR$'
        type: hr
        source: https://physionet.org/content/ctu-uhb-ctgdb/1.0.0/
        notes: fetal heart rate (bpm). UC (uterine contractions, tocography) stays unknown.

  - id: physionet/ecgiddb
    subject:
      rule: pattern
      pattern: '^(Person_\d{2})/'
      certain: true
      source: https://physionet.org/content/ecgiddb/1.0.0/
      evidence: >-
        The number of records for each person varies from 2 (collected during one day) to
        20
      notes: 310 recordings in 90 folders Person_01 to Person_90, from 90 persons.
    channels:
      - name: '^ECG I filtered$'
        type: other
        source: https://physionet.org/content/ecgiddb/1.0.0/
        notes: a filtered copy of the raw lead I of the same record; other, so that the signal is in the data once

  - id: physionet/edb
    subject:
      rule: pattern
      pattern: '^(e\d{4})$'
      same_person:
        - [e0118, e0119, e0120, e0121, e0122]
        - [e0123, e0124, e0125, e0126]
        - [e0129, e0133]
        - [e0136, e0139]
        - [e0147, e0148]
        - [e0154, e0155]
        - [e0162, e0163]
      namespace: edb-ltstdb  # 10 persons are also in ltstdb: see the ltstdb rule
      certain: true
      source: https://physionet.org/content/edb/1.0.0/
      evidence: >-
        Records e0118-e0122 come from the same subject; also records e0123-e0126, records
        e0129 and e0133, records e0136 and e0139, records e0147 and e0148, records e0154 and
        e0155, and records e0162 and e0163.

  - id: physionet/eegmmidb
    subject:
      rule: pattern
      pattern: '^(S\d{3})/'
      certain: false
      source: https://physionet.org/content/eegmmidb/1.0.0/
      notes: >-
        "Each subject completed 14 experimental runs"; the files are in folders S001 to
        S109 of 14 runs each, but the page does not say in words that a folder is a subject.
    channels:
      - name: '^[A-Za-z]{1,3}\d{0,2}[zZ]?\.+$'
        type: eeg
        source: https://physionet.org/content/eegmmidb/1.0.0/
        notes: The 64 EEG electrodes, named with trailing dots in the EDF files (Fc5., Cz..).

  - id: physionet/ephnogram
    subject:
      rule: table
      pattern: '^WFDB/(ECGPCG\d{4})$'
      table:
        file: ECGPCGSpreadsheet.csv
        delimiter: ','
        recording_column: Record Name
        subject_column: Subject ID
      certain: true
      source: https://physionet.org/content/ephnogram/1.0.0/
      evidence: >-
        The description of the corresponding physical activities and the unique subject IDs
        are provided in the spreadsheet: ECGPCGSpreadsheet.csv .
      notes: >-
        The page says 24 subjects and 69 recordings; the spreadsheet has 25 subjects and 70
        records.

  - id: physionet/fantasia
    subject:
      rule: one_per_recording  # 40 recordings f1y01 ... f2o10; subset/ has no signals
      certain: true
      source: https://physionet.org/content/fantasia/1.0.0/
      evidence: >-
        Twenty young (21 - 34 years old) and twenty elderly (68 - 85 years old)
        rigorously-screened healthy subjects underwent 120 minutes of continuous supine
        resting

  - id: physionet/grabmyo
    subject:
      rule: pattern
      pattern: '^Session[1-3]/session[1-3]_(participant\d+)/'
      certain: true
      source: https://physionet.org/content/grabmyo/1.0.1/
      evidence: Within each session folder, there are 43 sub-folders for each of the participants.
    channels:
      - name: '^[FW]\d{1,2}$'
        type: emg
        source: https://physionet.org/content/grabmyo/1.0.1/
        notes: >-
          Forearm (F1-F16) and wrist (W1-W12) EMG electrodes: "The forearm channels are
          listed as {F1-F8} ... The wrist channels are numbered {W1-W6}". The general rules
          would read F1-F16 as EEG positions. U1-U4 are "unused channels" (left unknown).

  - id: physionet/mitdb
    subject:
      rule: pattern
      pattern: '^(\d{3})$'
      same_person: [['201', '202']]
      certain: true
      source: https://physionet.org/content/mitdb/1.0.0/
      evidence: Records 201 and 202 originate from the same subject
    exclude:
      - pattern: '^x_mitdb/'
        reason: a part of another recording of the dataset
        source: https://physionet.org/content/mitdb/1.0.0/
        checked: >-
          2026-10-20: each of the 23 x_mitdb records (x_108 ... x_234) equals the first
          216,000 samples (10 min) of the record of the same number, both signals.

  - id: physionet/ptb-xl
    subject:
      rule: table
      pattern: '^(records500/\d{5}/\d{5}_hr)$'
      table:
        file: ptbxl_database.csv
        delimiter: ','
        recording_column: filename_hr
        subject_column: patient_id
      certain: true
      source: https://physionet.org/content/ptb-xl/1.0.3/
      evidence: Each record is identified by a unique ecg_id . The corresponding patient is encoded via patient_id .
      notes: 21,799 records from 18,869 patients (checked in ptbxl_database.csv, 2026-10-20).
    exclude:
      - pattern: '^records100/'
        reason: a lower-rate copy of another recording of the dataset
        source: https://physionet.org/content/ptb-xl/1.0.3/
        evidence: >-
          For the user’s convenience we also release a downsampled versions of the waveform
          data at a sampling frequency of 100Hz ( records100/ ).
    held_out:
      - pattern: '^(records500/\d{5}/\d{5}_hr)$'
        table:
          file: ptbxl_database.csv
          delimiter: ','
          recording_column: filename_hr
          column: strat_fold
          values: ['9', '10']
        benchmark: ptb-xl (folds 1-8 train, 9 validation, 10 test; Strodthoff et al. 2021)
        source: https://physionet.org/content/ptb-xl/1.0.3/
        evidence: >-
          recommended 10-fold train-test splits ( strat_fold ) obtained via stratified
          sampling while respecting patient assignments, i.e. all records of a particular
          patient were assigned to the same fold.
        notes: >-
          Checked in ptbxl_database.csv (2026-10-20): no patient is in two folds; fold 9 has
          2,183 records, fold 10 has 2,198.

  # Added 2026-10-27 for the datasets converted on 2026-10-21/22. Quotes checked against the
  # pages on 2026-10-27; record names checked against the RECORDS files of the releases.

  - id: physionet/challenge-2020
    exclude:
      - pattern: '.'
        reason: a copy of a recording of challenge-2021
        source: https://physionet.org/content/challenge-2021/1.0.3/
        evidence: >-
          The Challenge data include recordings from last year’s Challenge and many new
          recordings for this year’s Challenge
        checked: >-
          2026-10-27: the RECORDS files of all 46 subfolders of challenge-2020 1.0.2 are
          byte-identical to those of challenge-2021 1.0.3; the headers of HR00001 and E00001
          are identical.

  - id: physionet/challenge-2021
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/challenge-2021/1.0.3/
      notes: >-
        The headers give age, sex and diagnoses only, no patient. The CPSC (A, Q), Georgia
        (E) and Chapman-Shaoxing/Ningbo (JS) records are each their own subject.
    exclude:
      - pattern: '(^|/)HR\d{5}$'
        reason: a copy of a recording of ptb-xl
        source: https://physionet.org/content/challenge-2021/1.0.3/
        evidence: >-
          derived from: PTB Diagnostic ECG Database v1.0.0 / PTB-XL, a large publicly
          available electrocardiography dataset v1.0.1
        checked: >-
          2026-10-27: HR00001, HR10500 and HR21837 have the samples of PTB-XL 1.0.3
          records500 ecg_id 1, 10500 and 21837 (same first values and checksums). The 38 HR
          records with no PTB-XL 1.0.3 row are the identical-waveform duplicates that PTB-XL
          removed (ptbxl_v102_changelog.txt, ptbxl_v103_changelog.txt).
      - pattern: '(^|/)S\d{4}$'
        reason: a copy of a recording of ptbdb
        source: https://physionet.org/content/challenge-2021/1.0.3/
        evidence: >-
          derived from: PTB Diagnostic ECG Database v1.0.0 / PTB-XL, a large publicly
          available electrocardiography dataset v1.0.1
        checked: >-
          2026-10-27: S0001, S0300, S0548 and S0549 are the records of lines 1, 300, 548 and
          549 of ptbdb's RECORDS (same lengths; values halved by the gain 1000 instead of
          2000 per mV; 12 of the 15 leads).
      - pattern: '(^|/)I\d{4}$'
        reason: a copy of a recording of incartdb
        source: https://physionet.org/content/challenge-2021/1.0.3/
        checked: >-
          2026-10-27: I0001, I0040 and I0075 are incartdb I01, I40 and I75 (same first
          values after the gain change); I0036 (I36) is absent.

  - id: physionet/hd-semg
    subject:
      rule: pattern
      pattern: '(?:^|/)subject_?(\d{2})_session_?[12]/'
      certain: true
      source: https://physionet.org/content/hd-semg/2.0.0/
      evidence: >-
        We acquired data from 20 subjects with each subject participating in our experiment
        twice on separate days
      notes: The same 20 subjects are in all five sub-datasets (pr, mvc, 1dof, ndof, random).
    exclude:
      - pattern: '_preprocess_'
        reason: a filtered copy of another recording of the dataset
        source: https://physionet.org/content/hd-semg/2.0.0/
        evidence: >-
          We provide both raw HD-sEMG signals and preprocessed HD-sEMG signals in our
          dataset. ... filtered with a 10--500 Hz 8-order Butterworth bandpass filter
    channels:
      - name: '^(ED|EP|FD|FP)-\d-\d$'
        type: emg
        source: https://physionet.org/content/hd-semg/2.0.0/
        notes: >-
          The 256 electrodes of the "256-channel HD-sEMG" (four 8x8 grids). The finger force
          channels (thumb ... little) are not a biosignal and stay unknown.

  - id: physionet/hmc-sleep-staging
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/hmc-sleep-staging/1.1/
      notes: >-
        "Night recordings are identified by a sequence number SNXXX"; neither the page nor
        the paper says whether two nights come from one person.

  - id: physionet/i-care
    subject:
      rule: pattern
      pattern: '(?:^|/)(\d{4})/\d{4}_\d{3}_\d{3}_[A-Z]+$'
      certain: true
      source: https://physionet.org/content/i-care/2.1/
      evidence: >-
        the binary signal file 0284_001_004_EEG.mat contains the first segment ... for
        patient 0284 of the I-CARE patient cohort.
    channels:
      - name: '^SpO2$'
        type: other
        source: https://physionet.org/content/i-care/2.1/
        evidence: Even when a channel has been provided, it may be disconnected or noisy.
        checked: >-
          2026-10-29: 200 recordings (40 at each of 200, 256, 500, 512 and 1024 Hz), 120 s
          in the middle of each: every one holds one stored value, 0 (at 500 Hz: 1, times a
          gain of 17.2 "nu"). An SpO2 of 0 is not a measurement; the analysis of the same day
          found the sampled i-care SpO2 channels constant in 180 s windows too.
        notes: >-
          A placeholder, not a signal: typed other, so a run that selects spo2 leaves it out.
          The other channels of the OTHER group keep their types.

  - id: physionet/incartdb
    subject:
      rule: pattern
      pattern: '(?:^|/)(I\d{2})$'
      same_person:
        - [I01, I02]
        - [I03, I04, I05]
        - [I06, I07]
        - [I09, I10, I11]
        - [I12, I13, I14]
        - [I16, I17]
        - [I18, I19]
        - [I20, I21, I22]
        - [I23, I24]
        - [I25, I26]
        - [I27, I28]
        - [I29, I30, I31, I32]
        - [I33, I34]
        - [I35, I36, I37]
        - [I38, I39]
        - [I40, I41]
        - [I42, I43]
        - [I44, I45, I46]
        - [I47, I48]
        - [I49, I50]
        - [I51, I52, I53]
        - [I54, I55, I56]
        - [I57, I58]
        - [I59, I60, I61]
        - [I62, I63, I64]
        - [I65, I66, I67]
        - [I68, I69]
        - [I70, I71]
        - [I72, I73]
        - [I74, I75]
      certain: true
      source: https://physionet.org/content/incartdb/1.0.0/
      evidence: >-
        Each .hea file also includes a patient number (1–32) that identifies the source
        recording; all records with a given patient number were obtained from the same
        Holter recording. For convenience, this information is also collected in the files
        record-descriptions.txt and files-patients-diagnoses.txt.
      notes: Groups from files-patients-diagnoses.txt (32 patients, 75 records).

  - id: physionet/ltafdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/ltafdb/1.0.0/
      notes: >-
        "84 long-term ECG recordings of subjects with paroxysmal or sustained atrial
        fibrillation"; the page does not say whether two records come from one person.

  - id: physionet/ltdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/ltdb/1.0.0/
      notes: '"a collection of 7 long-duration electrocardiogram (ECG) recordings"; persons not stated.'

  - id: physionet/ludb
    subject:
      rule: one_per_recording
      certain: true
      source: https://physionet.org/files/ludb/1.0.1/README
      evidence: Lobachevsky University Database (LUDB) contains 200 records from 200 subjects.

  - id: physionet/mimic-iv-ecg
    subject:
      rule: pattern
      pattern: '(?:^|/)p\d{4}/p(\d{8})/s\d{8}/'
      namespace: mimic-iv
      certain: true
      source: https://physionet.org/content/mimic-iv-ecg/1.0/
      evidence: >-
        The ECGs are grouped into subdirectories based on subject_id. ... The subject ID
        can be used to link a subject from MIMIC-IV-ECG to the other modules in the
        MIMIC-IV Clinical Database.

  - id: physionet/mimic4wdb
    subject:
      rule: pattern
      pattern: '(?:^|/)p\d{3}/p(\d{8})/\d{8}/'
      namespace: mimic-iv
      certain: true
      source: https://physionet.org/content/mimic4wdb/0.1.0/
      evidence: >-
        all records associated with a given patient are stored in a single folder named
        after the patient's subject_id. ... Each patient has a unique number (subject_id)
        which is used to identify the patient in MIMIC-IV.
    channels:
      - name: '^(V|MCL|III\+)$'
        type: ecg
        source: https://physionet.org/content/mimic4wdb/0.1.0/
        notes: A chest lead V, a modified chest lead (MCL), lead III; at the ECG rate, in mV.
      - name: '^(CVP|PAP|Ao|FAP|UAP|UVP)$'
        type: bp
        source: https://physionet.org/content/mimic4wdb/0.1.0/
        notes: >-
          Central venous, pulmonary artery, aortic, femoral artery, umbilical artery and vein
          pressure, in mmHg. ICP (intracranial pressure) and P stay unknown.
      - name: '^CO2$'
        type: resp
        source: https://physionet.org/content/mimic4wdb/0.1.0/
        notes: capnogram

  - id: physionet/nsrdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/nsrdb/1.0.0/
      notes: >-
        "18 long-term ECG recordings of subjects ... 5 men ... and 13 women": 18 persons
        for 18 records, but the page does not say one record per person.

  - id: physionet/ptb-xl-plus
    exclude:
      - pattern: '.'
        reason: derived from recordings of ptb-xl (median beats)
        source: https://physionet.org/content/ptb-xl-plus/1.0.1/
        evidence: >-
          This is a derivative dataset of the PTB-XL project ... the filenames contain the
          corresponding PTB-XL ECG identifiers

  - id: physionet/ptbdb
    subject:
      rule: pattern
      pattern: '^patient(\d{3})/'
      certain: true
      source: https://physionet.org/content/ptbdb/1.0.0/
      evidence: >-
        The database contains 549 records from 290 subjects ... Each subject is
        represented by one to five records.
    channels:
      - name: '^v[xyz]$'
        type: ecg
        source: https://physionet.org/content/ptbdb/1.0.0/
        notes: the three Frank leads (vx, vy, vz)

  - id: physionet/qtdb
    exclude:
      - pattern: '(?:^|/)sel'
        reason: an extract from a recording of another dataset (mitdb, stdb, svdb, nsrdb, edb, sddb, ltdb)
        source: https://physionet.org/files/qtdb/1.0.0/doc/node4.html
        evidence: >-
          QT Database records have record names of the form sel nnnn , where nnnn is the
          name of the original record in the source database.

  - id: physionet/sddb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/sddb/1.0.0/
      notes: >-
        "23 complete Holter recordings"; the clinical table numbers its subjects as the
        records (30-52), but the page does not say one record per person.

  - id: physionet/siena-scalp-eeg
    subject:
      rule: pattern
      pattern: '^(PN\d{2})/'
      certain: true
      source: https://physionet.org/content/siena-scalp-eeg/1.0.0/
      evidence: Each folder refers to a specific subject including between 1 and 5 data files
    channels:
      - name: '^(SPO2|HR|MK|PLET|\d{1,2}|[A-D])$'
        type: other
        source: https://physionet.org/content/siena-scalp-eeg/1.0.0/
        evidence: >-
          the list of the channels from which the EEG and EKG signals are extracted [...]
          (all other channels in the edf files must be ignored)
        checked: >-
          2026-10-29: SPO2 in 40 of the 41 recordings, HR, MK and PLET in 2, 120 s in the
          middle of each: SPO2, HR and PLET hold the stored value 0 (SpO2 0 %, 0 bpm), MK
          holds 8.
        notes: >-
          The Seizures-list-PNxx.txt files list EEG and EKG channels only; 1, 2, 3, 23, 31,
          33, 61-64 and A-D are not described.

  - id: physionet/sleep-edfx
    subject:
      rule: pattern
      pattern: '(?:^|/)(S[CT]\d\d\d)\d[A-Z]\d-PSG$'
      certain: true
      source: https://physionet.org/content/sleep-edfx/1.0.0/
      evidence: >-
        Files are named in the form SC4ssNEO-PSG.edf where ss is the subject number, and N
        is the night.
      notes: >-
        Group 1 keeps the study (SC4, ST7) with the subject number: the page does not say
        that SC and ST subject numbers are the same persons.
    channels:
      - name: '^EMG submental$'
        recording: '(?:^|/)SC\d{4}[A-Z]\d-PSG$'
        type: emg_envelope
        source: https://physionet.org/content/sleep-edfx/1.0.0/
        evidence: >-
          The submental-EMG signal was electronically highpass filtered, rectified and
          low-pass filtered after which the resulting EMG envelope expressed in uV rms
          (root-mean-square) was sampled at 1Hz.
        notes: >-
          Sleep Cassette (SC) files only. In the Sleep Telemetry (ST) files "EOG, EMG and EEG
          signals were sampled at 100 Hz": that EMG stays emg (general rule).
      - name: '^(Event marker|Marker)$'
        type: other
        source: https://physionet.org/content/sleep-edfx/1.0.0/
        evidence: >-
          Oro-nasal airflow, rectal body temperature and the event marker were also sampled
          at 1Hz. [...] EOG, EMG and EEG signals were sampled at 100 Hz, and the event marker
          at 1 Hz.
        notes: >-
          SC "Event marker" (1 Hz) and ST "Marker" (unit ID+M-E). The ST marker is stored at
          10 Hz, not 1 Hz as the page says.

  - id: physionet/stdb
    subject:
