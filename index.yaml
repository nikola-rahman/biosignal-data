  - id: physionet/ltstdb
    subject:
      rule: pattern
      pattern: '^(s\d{4})\d$'
      # Records with an excerpt in edb, from their headers ("An excerpt of this recording is
      # included in the European ST-T Database (record e0113)"): the person gets the edb id
      # (the first of its edb group), so both datasets put the person in one split.
      same_person:
        - [e0103, s2015]
        - [e0104, s2029]
        - [e0105, s2016]
        - [e0113, s2002]
        - [e0123, s2030]  # e0125 (edb group e0123-e0126)
        - [e0127, s2017]
        - [e0129, s2031]
        - [e0162, s2018]
        - [e0603, s2058]
        - [e0604, s2059]
      namespace: edb-ltstdb
      certain: true
      source: https://physionet.org/content/ltstdb/1.0.0/
      evidence: >-
        Records obtained from the same subject have names that differ in the last digit
        only. ... Ten additional recordings of the Long-Term ST Database are from the
        collection originally gathered by the Pisa group for the European ST-T Database,
        which contains two-hour excerpts of some of these same recordings.
      notes: >-
        86 records, 80 persons. The ten edb pairs were read from the record headers on
        2026-10-27 (s20021 e0113, s20151 e0103, s20161 e0105, s20171 e0127, s20181 e0162,
        s20291 e0104, s20301 e0125, s20311 e0129, s20581 e0603, s20591 e0604).
    channels:
      - name: '^(MV2|ML2|E-S|A-S|A-I)$'
        type: ecg
        source: https://physionet.org/content/ltstdb/1.0.0/
        notes: Holter ECG leads (modified V2, modified lead 2, and the EASI-like E-S, A-S, A-I).

  - id: physionet/shdb-af
    subject:
      rule: table
      pattern: '^(\d{3})$'
      table:
        file: AdditionalData.csv
        delimiter: ','
        recording_column: Data_ID
        subject_column: Subject_ID
      certain: true
      source: https://physionet.org/content/shdb-af/1.0.1/
      evidence: >-
        Each file name corresponds uniquely to a Data_ID, specifically matching the
        'Data_ID' field in the AdditionalData.csv.
      notes: 128 records from 122 subjects (checked in AdditionalData.csv, 2026-10-27).

  - id: physionet/vitaldb
    subject:
      rule: table
      pattern: '^vital_files/0*(\d+)$'
      table:
        file: clinical_data.csv
        delimiter: ','
        recording_column: caseid
        subject_column: subjectid
      certain: true
      source: https://physionet.org/content/vitaldb/1.0.0/
      evidence: >-
        Individual identifiers of the hospital ID (subjectid) was also added for
        reoperation case identification
      notes: >-
        6,388 cases; 237 subjects have more than one case (up to 14). vitaldb-arrhythmia
        has annotations only (no recordings with signals), so it needs no rule.
    channels:
      - name: '^SNUADC/ECG_(II|V5)$'
        type: ecg
        source: https://vitaldb.net/dataset/
      - name: '^SNUADC/PLETH$'
        type: ppg
        source: https://vitaldb.net/dataset/
      - name: '^(SNUADC/(ART|FEM|CVP)|CardioQ/ABP)$'
        type: bp
        source: https://vitaldb.net/dataset/
        notes: Arterial (ART, FEM, CardioQ ABP) and central venous (CVP) pressure waveforms.
      - name: '^BIS/EEG[12]_WAV$'
        type: eeg
        source: https://vitaldb.net/dataset/
      - name: '^Primus/(CO2|AWP)$'
        type: resp
        source: https://vitaldb.net/dataset/
        notes: >-
          The anaesthesia machine's capnogram (CO2) and airway pressure (AWP) waveforms, the
          breathing of a ventilated patient. CardioQ/FLOW (aortic flow velocity) stays unknown.
