  - id: physionet/tpehgdb
    subject:
      rule: unknown
      certain: false
      source: https://physionet.org/content/tpehgdb/1.0.1/
      notes: >-
        "300 uterine EMG records from 300 pregnancies (one record per pregnancy)"; the page
        does not say whether one woman had two pregnancies in the set.
    channels:
      - name: '^[123]$'
        type: emg
        source: https://physionet.org/content/tpehgdb/1.0.1/
        notes: >-
          The three uterine EMG (EHG) channels. The _DOCFILT channels are filtered copies of
