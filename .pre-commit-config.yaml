repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: catalog
        name: validate catalog and regenerate docs
        entry: bash -c 'uv run biosignal-data dev validate && uv run biosignal-data dev docs'
        language: system
        pass_filenames: false
        files: ^catalog/
