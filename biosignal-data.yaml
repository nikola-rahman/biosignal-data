# Settings that do not change between runs. Nothing has a default: every value is used as
# written here, and a run that needs a missing value stops with an error.
# Secrets are not stored here: see docs/access.md for the BIOSIGNAL_* variables.

# The S3 storage for s3:// destinations (values from the provider's S3 guide).
# Keys: BIOSIGNAL_ACCESS_KEY_ID and BIOSIGNAL_SECRET_ACCESS_KEY.
s3:
  endpoint: https://s3.hippius.com
  region: decentralized
  addressing: path

download:
  workers: 16                  # parallel file downloads, shared by all datasets of a run
  parallel_datasets: 6         # datasets listed and copied at the same time
  physionet_website_connections: 2  # all requests to physionet.org at once; it blocks a
                               # server that opens many (16 did, on 2026-10-19)

standardize:
  workers: 4                   # batches of recordings converted at the same time
  part_bytes: 67108864         # 64 MiB: a batch closes when its raw files reach this, so many
                               # small recordings share one part (fewer S3 requests)
  processes: 8                 # recordings compressed and checked in processes (CPU work;
                               # a staged ZIP only): the cores of the machine

# biosignal-data quality: per-channel measurements of the standard layer.
quality:
  flat_s: 1.0                  # a run of one stored value counts as flat from 1 s on
  percentile_sample: 100000    # valid values per channel for the 1st, 50th, 99th percentile
  seed: 0
  workers: 8                   # recordings measured at the same time; more made the S3 storage
                               # answer 429 Too Many Requests, with other jobs (2026-10-20)

# Disk for TUH EEG: rsync writes files here before they are uploaded.
staging:
  dir: ~/biosignal-staging
  keep: true

# Where RawDataset.local_path keeps fetched raw files.
read:
  cache_dir: ~/.cache/biosignal-data
